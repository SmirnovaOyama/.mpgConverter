<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>mpgconv</title>
    <meta name="description" content="Convert any video to an MPEG program stream (.mpg)." />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%F0%9F%93%BC%3C/text%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div class="shell">
      <header class="head">
        <button id="language" class="icon-button" type="button" data-i18n-aria="language.aria">
          <span data-i18n="language">中文</span>
        </button>
        <button
          id="settings-toggle"
          class="icon-button"
          type="button"
          data-i18n-aria="settings"
          aria-expanded="false"
          aria-controls="settings"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M4 7h10m3 0h3M4 17h3m3 0h10"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
            />
            <circle cx="15.5" cy="7" r="2.2" fill="none" stroke="currentColor" stroke-width="1.5" />
            <circle cx="8.5" cy="17" r="2.2" fill="none" stroke="currentColor" stroke-width="1.5" />
          </svg>
          <span data-i18n="settings">Settings</span>
        </button>
      </header>

      <main>
        <section id="drop" class="dropzone" tabindex="0" role="button" data-i18n-aria="drop.aria">
          <h1 data-i18n="drop.title">Drop the videos to convert here</h1>
          <p class="drop-sub">
            <span class="link" data-i18n="drop.browse">or click here to browse and select files</span>
          </p>
          <input id="file-input" type="file" multiple hidden />
        </section>

        <!-- Outside the drop zone: nesting a button inside a role="button" would
             fire both handlers and is awkward for screen readers. -->
        <p class="sample-line">
          <button id="sample" class="linkbutton" type="button" data-i18n="drop.sample">
            try a sample
          </button>
        </p>

        <section id="settings" class="settings" hidden>
          <div class="row">
            <div class="field">
              <span class="label" id="preset-label" data-i18n="label.preset">Preset</span>
              <div id="preset"></div>
            </div>
            <div class="field">
              <span class="label" id="quality-label" data-i18n="label.quality">Quality</span>
              <div id="quality"></div>
            </div>
          </div>
          <p class="hint" id="preset-hint"></p>

          <div class="row four">
            <div class="field">
              <label for="video-bitrate" data-i18n="label.videoBitrate">Video bitrate</label>
              <input id="video-bitrate" type="text" placeholder="4000k" />
            </div>
            <div class="field">
              <label for="audio-bitrate" data-i18n="label.audioBitrate">Audio bitrate</label>
              <input id="audio-bitrate" type="text" placeholder="224k" />
            </div>
            <div class="field">
              <label for="size" data-i18n="label.size">Frame size</label>
              <input id="size" type="text" placeholder="720x480" />
            </div>
            <div class="field">
              <label for="fps" data-i18n="label.fps">Frame rate</label>
              <input id="fps" type="text" data-i18n-placeholder="placeholder.fps" placeholder="source" />
            </div>
          </div>
          <p class="hint" data-i18n="hint.blank">
            Everything follows the source if you left blank, normalised to what MPEG-1/2 allows.
          </p>
        </section>

        <div id="loader" class="loader" hidden>
          <div class="loader-bar"><div id="loader-fill" class="loader-fill"></div></div>
          <p id="loader-text" class="hint" data-i18n="loader.downloading">
            Downloading the ffmpeg engine…
          </p>
        </div>

        <ul id="queue" class="queue"></ul>

        <!-- Status first so it sits on the left while the buttons group right. -->
        <div id="actions" class="actions" hidden>
          <span id="status" class="status" role="status" aria-live="polite"></span>
          <button id="convert" class="primary" type="button" disabled data-i18n="btn.convert">
            Convert
          </button>
          <button id="cancel" class="ghost" type="button" hidden data-i18n="btn.cancel">Cancel</button>
          <button id="download-all" class="ghost" type="button" hidden data-i18n="btn.downloadAll">
            Download all
          </button>
          <button id="clear" class="ghost" type="button" data-i18n="btn.clear">Clear</button>
        </div>
      </main>

      <footer class="foot" data-i18n="footer">
        This application runs entirely in your browser, and nothing is uploaded.
      </footer>
    </div>

    <a
      class="github"
      href="https://github.com/SmirnovaOyama/.mpgConverter"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="GitHub"
    >
      <svg viewBox="0 0 16 16" aria-hidden="true">
        <path
          fill="currentColor"
          d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.012 8.012 0 0 0 16 8c0-4.42-3.58-8-8-8Z"
        />
      </svg>
    </a>

    <template id="item-template">
      <li class="item">
        <div class="item-head">
          <div class="item-name"></div>
          <div class="item-meta"></div>
        </div>
        <div class="item-foot">
          <span class="state"></span>
          <span class="spacer"></span>
          <a class="download" hidden download data-i18n="btn.download">Download</a>
          <button class="remove icon-only" type="button" data-i18n-aria="btn.remove">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M6 6l12 12M18 6L6 18"
                fill="none"
                stroke="currentColor"
                stroke-width="1.6"
                stroke-linecap="round"
              />
            </svg>
          </button>
        </div>
        <div class="bar"><div class="fill"></div></div>
        <ul class="notes"></ul>
      </li>
    </template>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
